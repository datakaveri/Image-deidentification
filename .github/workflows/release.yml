name: Release & Publish Image

on:
  push:
    tags:
      - 'v*.*.*'
  # Publish an existing tag again, e.g. when the tag-push run failed. Tags are
  # immutable here, so a broken run cannot be fixed by re-pushing the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (vMAJOR.MINOR.PATCH)'
        required: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/datakaveri/skald-image
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Tag
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::'$TAG' is not a vMAJOR.MINOR.PATCH tag"
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only the version tag is pushed. `latest` is retagged by hand in GHCR to
      # whichever version is being rolled out (see datakaveri/Docker-Compose).
      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
          cache-from: type=gha

      # gh is preinstalled on the runner. The repo only allows GitHub-owned and
      # verified actions, so a third-party release action would not start.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it as is."
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes README.md LICENSE
          fi
