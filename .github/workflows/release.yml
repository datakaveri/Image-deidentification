name: Release & Publish Image

# Releases normally happen from ci.yml when a version bump is merged to main.
# This workflow covers the other cases: a vX.Y.Z tag pushed by hand, or
# re-publishing an existing tag whose run failed (tags are immutable here, so
# re-pushing a tag is not an option).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish (vMAJOR.MINOR.PATCH)'
        required: true

permissions:
  contents: read

jobs:
  lint-test:
    uses: ./.github/workflows/tests.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  release:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/datakaveri/skald-image
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # The workflow's own commit provides scripts/; the tagged code, which may
      # predate them, is checked out separately as the build context.
      - name: Checkout Workflow Code
        uses: actions/checkout@v7

      - name: Checkout Tagged Code
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          path: tagged

      # Validates the tag and decides whether it may become :latest.
      - name: Release Info
        id: release
        run: scripts/release_info.sh "$TAG" | tee -a "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image Tags and Labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ steps.release.outputs.highest == 'true' }}

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: tagged
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # gh is preinstalled on the runner. The repo only allows GitHub-owned and
      # verified actions, so a third-party release action would not start.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.release.outputs.highest }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it as is."
          else
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --generate-notes --latest="$LATEST" README.md LICENSE
          fi
