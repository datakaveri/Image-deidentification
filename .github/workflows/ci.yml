name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-test:
    uses: ./.github/workflows/tests.yml

  # Continuous delivery for main, once the tests pass:
  #   always                      -> skald-image:main, skald-image:sha-<short>
  #   __version__ not yet tagged  -> also :vX.Y.Z, tag vX.Y.Z and a GitHub Release
  #   ...and it is the highest    -> also :latest (what the TEE compose pulls)
  # The image is pushed before the tag is created, so a failed build never
  # leaves a tag behind (tags are immutable here).
  publish:
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: publish-main
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Release Info
        id: release
        run: scripts/release_info.sh | tee -a "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image Tags and Labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/datakaveri/skald-image
          flavor: latest=false
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
            type=raw,value=${{ steps.release.outputs.tag }},enable=${{ steps.release.outputs.tagged == 'false' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.tagged == 'false' && steps.release.outputs.highest == 'true' }}

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A tag created with GITHUB_TOKEN does not trigger release.yml, so the
      # release is created here rather than there; nothing is built twice.
      - name: Tag and Create GitHub Release
        if: steps.release.outputs.tagged == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          LATEST: ${{ steps.release.outputs.highest }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" \
            --generate-notes --latest="$LATEST" README.md LICENSE
