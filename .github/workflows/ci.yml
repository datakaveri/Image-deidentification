name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.lock

      # The lock file carries --extra-index-url https://download.pytorch.org/whl/cpu
      # and pins torch/torchvision to +cpu builds, so no CUDA wheels are downloaded.
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Lint and Format Check (Ruff & Black)
        run: |
          ruff check .
          black --check .

      # No step here downloads model weights; the tests run without them.
      - name: Run Test Suite with Coverage
        run: |
          pytest --cov --cov-report=term-missing --cov-report=xml

  # Continuous delivery for main: once the tests pass on a push to main, publish
  # skald-image:main and skald-image:sha-<short>. Version tags are published by
  # release.yml, and `latest` is never touched here; it is retagged by hand at
  # rollout (see datakaveri/Docker-Compose).
  publish-main:
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-main
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image Tags and Labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/datakaveri/skald-image
          flavor: latest=false
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
